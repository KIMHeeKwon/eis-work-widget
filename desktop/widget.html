<meta charset="utf-8">
<title>EIS 근무시간</title>
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  /* 창 자체가 위치를 잡으므로 판은 창 안에 고정한다 */
  #eisw{top:14px!important;left:14px!important;right:auto!important}
  /* 판을 끌면 창이 따라 움직인다 (위젯 자체의 드래그는 창 안에서 의미가 없다) */
  #eisw .hdl{-webkit-app-region:drag;cursor:default!important}
  #eisw .x,#eisw .r{-webkit-app-region:no-drag}
</style>
<script src="widget-core.js"></script>
<script>
  clearInterval(window.__eiswTimer);   // 여기엔 읽을 EIS 화면이 없다. 값은 main이 보낸다

  window.__eiswIpc.onData(function (d) {
    window.__eiswRender(d, Date.now() - d.at > 15 * 60 * 1000);
    var x = document.querySelector('#eisw .x');       // 렌더할 때마다 새로 그려지므로 매번 다시 건다
    if (x) x.onclick = function () { window.__eiswIpc.hide(); };
    // 여기서는 화면을 직접 읽지 못하므로, 위젯이 걸어 둔 동작을 main에 부탁하는 것으로 바꾼다
    var r = document.querySelector('#eisw .r');
    if (r) r.onclick = function () { r.className = 'r busy'; window.__eiswIpc.refresh(); };
  });
</script>
